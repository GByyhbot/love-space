<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcf7f8">
  <title>恋爱空间暂时离线</title>
  <link rel="stylesheet" href="file:///android_asset/lovespace-offline.css">
  <script src="file:///android_asset/lovespace-offline.js" defer></script>
</head>
<body>
  <main class="panel">
    <div class="brand"><span class="mark" aria-hidden="true">♡</span><span>恋爱空间</span></div>
    <div class="art" aria-hidden="true"><span class="cloud cloud-one"></span><span class="cloud cloud-two"></span><span class="heart">♥</span></div>
    <p class="eyebrow">OUR LITTLE WORLD</p>
    <h1>空间暂时没有连上</h1>
    <p class="intro">别担心，你的空间和记录还在。确认网络正常后再试一次。</p>

    <section class="diagnostics" aria-label="连接信息">
      <div class="row"><span>应用版本</span><strong id="app-version">读取中</strong></div>
      <div class="row"><span>网络状态</span><strong id="network-state">读取中</strong></div>
      <div class="row"><span>连接信息</span><strong id="connection-detail">连接失败</strong></div>
    </section>

    <nav class="actions" aria-label="恢复连接">
      <a class="button primary" href="lovespace://retry">重试连接</a>
      <a class="button secondary" href="lovespace://browser">用浏览器打开</a>
    </nav>
    <p class="footnote">页面和记录需要联网使用。网络恢复后，点击“重试连接”即可回到空间。</p>
  </main>
</body>
</html>
