# Flutter CI（方案 v2 阶段 1 · 执行环境决策：iOS 构建走 GitHub Actions macOS runner）
#
# - android job：每次 push 触发（analyze + test + debug APK），本机不再依赖
# - ios job：仅手动触发（workflow_dispatch）。私有仓库 macOS 分钟按 10 倍计费
#   （免费额度 2000 分钟/月 ≈ 13 次构建），所以 lint/test 不在 macOS 上跑；
#   当前只做「能编译」验证（--no-codesign）。TestFlight 签名分发在阶段 6 接入
#   （需要 Apple Developer Program 与 secrets：APPLE_ID/APPLE_TEAM_ID 等）。
name: flutter-ci

on:
  push:
    branches: [main]
    paths:
      - 'app-flutter/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze --fatal-infos=false
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-flutter/build/app/outputs/flutter-apk/app-debug.apk

  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    defaults:
      run:
        working-directory: app-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --no-codesign
