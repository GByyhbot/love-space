name: CI

# 合并版（2.4.6 收尾定案）：原 ci.yml（后端 pytest + Web 冒烟）与
# flutter-ci.yml（Flutter analyze/test/debug 包 + iOS 仅手动）并进同一文件，
# 四类 job 并排。触发面不缩水：
# - 后端 test / web 两 job：所有分支 push + 全部 PR 每次都跑（原 ci.yml 口径）。
#   branches: ['**'] 表示「所有分支」——v* tag push 不触发 CI（tag 只走
#   Docker；原 ci.yml 的裸 push: 连 tag 一起触发，属顺带收口，回执注明）。
# - android job：dorny/paths-filter 门控 app-flutter/** 或本文件变更才跑
#   （等价搬入原 flutter-ci.yml 的 paths 触发；分支面从 main-only 放宽到
#   全分支，只宽不窄）。
# - ios job：仅手动 workflow_dispatch（私有仓 macOS 分钟按 10 倍计费口径不变）。
# - android.yml（旧 Capacitor 壳打包，v* tag 也会触发）本版本退役删除：
#   此后 v* tag 只触发 Docker 一个流程。已发布的 v1.7.4 Release 不动。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # job 级路径门控：flutter 变了才跑 android（不许靠删触发省事）
  changes:
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # paths-filter 对 push 事件要 before..after diff
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            flutter:
              - 'app-flutter/**'
              - '.github/workflows/ci.yml'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装系统依赖（媒体测试需要 ffmpeg）
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 安装 Python 依赖
        run: pip install -r requirements-dev.txt
      - name: 语法检查
        run: python -m py_compile app/*.py
      - name: 运行测试
        run: python -m pytest -q

  # 后端有 pytest 兜着，前端此前是零覆盖：app.js 里 40 万字符的任何一次改动，
  # 只有人点开页面才知道有没有炸。这个 job 只覆盖最贵的那几条路径
  # （见 tests/e2e/smoke.py 顶部），跑一次约 40 秒。
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: 安装 Python 依赖
        run: pip install -r requirements-dev.txt
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
      - name: 安装 chromium
        run: python -m playwright install --with-deps chromium
      - name: 前端冒烟
        # 服务和脚本必须放在同一个 step 里：跨 step 的后台进程不可靠，
        # 用 trap 保证脚本跑完（或挂掉）后一定把 uvicorn 收掉。
        run: |
          export DATA_DIR="$(mktemp -d)"
          export RUN_WORKER=false
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8321 --log-level warning &
          SERVER=$!
          trap "kill $SERVER 2>/dev/null || true" EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8321/api/status >/dev/null && break
            sleep 1
          done
          python tests/e2e/smoke.py
      - name: 失败时留下现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: test-results/
          if-no-files-found: ignore

  # Flutter：analyze + test + debug 包（原 flutter-ci.yml android job 原样并入）。
  # 仅在 app-flutter/** 或本工作流文件变更时跑（changes job 门控）；
  # workflow_dispatch 手动触发时 paths-filter 无 before 基线，dorny 默认全
  # true → 手动跑全量，符合预期。
  android:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-flutter
    env:
      # 依赖锁定（2026-11-19 缺陷单定案，同 apk-release.yml）：
      # pubspec.lock 的 hosted url 现为 pub.dev，CI 不设 PUB_HOSTED_URL
      # 时 pub 视锁定为异源、全量重解析 → 上游新版本静默漏进 CI；
      # 与本机同源 + --enforce-lockfile：锁定无法满足时硬失败不许静默重解析。
      PUB_HOSTED_URL: https://pub.dev
      # 2026-11-26（依赖源切换）：pub.flutter-io.cn 归档端点服务端 502，
      # 与 PUB_HOSTED_URL 同时切到官方源。铁律实质不变——本地与 CI 仍同源，
      # 仍加 --enforce-lockfile；只是源从镜像换成官方。回退：两行 env 改回即退。
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 钉版本与本地一致：新版 Dart 移除了 dart analyze --fatal-infos（exit 64 事故），
          # 且避免 analyzer 规则漂移导致 CI 与本地结论不一致
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      # 2026-11-25（审计 P2-1）：外部仓库（Maven Central / Gradle 插件门户）会对
      # CI 出口返回 429，导致依赖解析失败而非代码问题（run 45145668345 即此）。
      # 这里只对「依赖解析类」失败重试**一次**，其它失败照旧立刻红，不许掩盖真问题。
      - name: Build debug APK（依赖解析失败自动重试一次）
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
        run: |
          set +e
          flutter build apk --debug > /tmp/apk1.log 2>&1
          code=$?
          tail -30 /tmp/apk1.log
          if [ $code -ne 0 ]; then
            if grep -qE "429|Too Many Requests|Could not resolve|Could not GET|Could not download" /tmp/apk1.log; then
              echo "::warning::疑似外部仓库限流导致依赖解析失败，自动重试一次（上限 1）"
              set -e
              flutter build apk --debug
            else
              echo "::error::构建失败原因非依赖解析，不重试"
              exit $code
            fi
          fi
      # 2.8.0 fix7：静止心跳判定（HeartbeatGate）的 JVM 单测——它在
      # android/app/src/test 下，不进 `flutter test` 的范围，必须单独跑；
      # 放在 build apk 之后，复用已解析的 Gradle 依赖与 local.properties。
      - name: 原生心跳单测（fix7）
        working-directory: app-flutter/android
        # 同款重试口径：该步也是 gradle 依赖解析，历史上同样吃过 429
        # （run 45321079375 / 45322134460）
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --console=plain > /tmp/gw1.log 2>&1
          code=$?
          tail -30 /tmp/gw1.log
          if [ $code -ne 0 ]; then
            if grep -qE "429|Too Many Requests|Could not resolve|Could not GET|Could not download" /tmp/gw1.log; then
              echo "::warning::疑似外部仓库限流，gradle 单测自动重试一次（上限 1）"
              set -e
              ./gradlew :app:testDebugUnitTest --console=plain
            else
              echo "::error::失败非依赖解析，不重试"
              exit $code
            fi
          fi
      # 注册层守卫（产物级，2.8.0 第 0 步 fix5）：既有 peer_loc_verify /
      # peer_toggle_visibility 全程 mock 了 peer_loc/native，只测协议形状、
      # 测不到接线。这一步读**产物**的 AndroidManifest（aapt dump xmltree）
      # 断言 launcher activity = 自有 MainActivity（含通道注册）；源码级
      # 断言同脚本内一并跑。不过即 job 失败（防回退到插件 Activity）。
      - name: 注册层守卫（产物级 aapt）
        run: python3 ../scripts/check_activity_registration.py --apk build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-flutter/build/app/outputs/flutter-apk/app-debug.apk

  # iOS：仅手动触发（workflow_dispatch）。私有仓库 macOS 分钟按 10 倍计费
  # （免费额度 2000 分钟/月 ≈ 13 次构建），所以 lint/test 不在 macOS 上跑；
  # 当前只做「能编译」验证（--no-codesign）。TestFlight 签名分发在阶段 6 接入
  # （需要 Apple Developer Program 与 secrets：APPLE_ID/APPLE_TEAM_ID 等）。
  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    defaults:
      run:
        working-directory: app-flutter
    env:
      # 同 android job：与 pubspec.lock 的 hosted url 同源，锁定生效
      PUB_HOSTED_URL: https://pub.dev
      # 2026-11-26（依赖源切换）：pub.flutter-io.cn 归档端点服务端 502，
      # 与 PUB_HOSTED_URL 同时切到官方源。铁律实质不变——本地与 CI 仍同源，
      # 仍加 --enforce-lockfile；只是源从镜像换成官方。回退：两行 env 改回即退。
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --no-codesign
