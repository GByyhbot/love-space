# APK Release 构建（仅手动触发 workflow_dispatch）
#
# 用途：本机 Gradle 路径在系统级文件 I/O 上死锁（重启/杀软排除均无效），
# 出包改走 CI。本工作流与 flutter-ci.yml 完全独立——既有 analyze/test 作业不动。
#
# 签名一致性（2.4.3 提交二改造）：release 构建走正式签名——
# ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
# ANDROID_KEY_PASSWORD 四个 Secret 在 job 里拼成 key.properties（落
# $RUNNER_TEMP，仓库外），经 LOVE_KEY_PROPERTIES 传给 Gradle 启用正式签名。
# 钥匙缺失/损坏 → 硬失败，禁止回退 debug 签名出包（debug 签名的正式版
# 会污染之后全部覆盖更新与在线更新——熔断特例）。
# 构建后 apksigner 对账：产物签名者指纹必须等于钥匙证书指纹，不一致
# 当场失败不许上传。debug 构建链（flutter-ci.yml / 本机）不受影响——
# build.gradle.kts 只在 LOVE_KEY_PROPERTIES 四项齐全时启用正式签名。
#
# 诊断保留（2.4.3 第 0 点）：还原指纹（a）与产物指纹（b）只打指纹地
# 打印在日志里，供历次构建对账；定位用的路径探测步已完成使命移除。
#
# 触发：GitHub 仓库 Actions → "APK Release" → Run workflow → 选 main；
# 可选 inputs.notes 填本次更新要点（写入 Release 说明，缺省给通用句）。
# inputs.publish_release：'false' = 只构建正式签名 APK + 上传 artifact，
# **不发布/不改写 GitHub Release 资产**（验证线出包专用：同版本重跑不会
# 覆盖线上已发布的同名 Release；2.8.0 fix8 起支持）。
# 产物：artifact lovespace-arm64-v<版本> + GitHub Release app-v<版本>
# （APK + .sha256 资产；「⚠️ 卸载重装」提醒见 2.4.3 交付摘要）。
name: APK Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: '本次更新要点（逐条短句，写入 Release 说明；可空）'
        required: false
        default: ''
      publish_release:
        description: '是否发布 GitHub Release（false = 只出签名 APK 与 artifact）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# 发布 Release 需要 contents: write（gh release create/upload）
permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-flutter
    env:
      # secrets 不能直接用在 step 的 if 里，先经 env 中转
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # 依赖锁定（2026-11-19 缺陷单定案）：pubspec.lock 的 hosted url 现为
      # https://pub.dev（2026-11-26 依赖源切换，见下）；CI 不设该变量时
      # pub 视锁定为异源、全量重解析 → 上游新发版本直接漏进构建（11-18 深夜
      # jni 1.2.0/jni_flutter 1.1.0/dbus 0.8.1 发布，11-19 重打的包静默换芯
      # 致真机不可登录）。与本机同源设 PUB_HOSTED_URL → 锁定恢复生效；
      # pub get 加 --enforce-lockfile：锁定再无法满足时硬失败，不许静默重解析。
      PUB_HOSTED_URL: https://pub.dev
      # 2026-11-26（依赖源切换）：pub.flutter-io.cn 归档端点服务端 502，
      # 与 PUB_HOSTED_URL 同时切到官方源。铁律实质不变——本地与 CI 仍同源，
      # 仍加 --enforce-lockfile；只是源从镜像换成官方。回退：两行 env 改回即退。
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 钉版与 flutter-ci.yml / 本机一致
          flutter-version: 3.47.9
          cache: true

      # 正式钥匙还原：解码到 runner 临时目录（禁止进工作区/artifact）。
      # 缺失/损坏 → 硬失败（熔断特例，禁止 debug 签名兜底）。
      - name: Restore release keystore
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::正式签名 Secret 不齐（ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD），按熔断特例硬失败——禁止回退 debug 签名出包"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          # 自检：打不开（口令不配/文件损坏）当场失败
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASS" > /dev/null
          # 诊断 a（保留）：打印正式钥匙证书指纹（只打指纹，不打内容）
          echo "── 诊断 a：正式钥匙 $KEY_ALIAS 证书指纹 ──"
          keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASS" \
            | grep -E "SHA1:|SHA256:" || true
          # key.properties：四项齐全才启用正式签名（见 build.gradle.kts）。
          # storeFile 用绝对路径，文件与本 properties 都在 $RUNNER_TEMP（仓库外）。
          cat > "$RUNNER_TEMP/key.properties" <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')
          VERSION_NAME="${VERSION%%+*}"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "构建版本 $VERSION_NAME"

      - run: flutter pub get --enforce-lockfile
        env:
          LOVE_KEY_PROPERTIES: ${{ runner.temp }}/key.properties

      # 正式签名构建：LOVE_KEY_PROPERTIES 四项齐全 → signingConfigs.release
      - run: flutter build apk --release --split-per-abi
        env:
          LOVE_KEY_PROPERTIES: ${{ runner.temp }}/key.properties

      # 签名对账（硬性）：产物签名者指纹必须等于钥匙证书指纹，不一致当场
      # 失败不许把错签名的包传上去。
      - name: Verify signature (must match keystore)
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          BT="$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort -V | tail -1 | tr -d '\n')"
          echo "── 诊断 b：产物 apksigner 证书指纹（build-tools: $BT）──"
          "$BT/apksigner" verify --print-certs "$APK"
          APKSIGNER_SHA1="$("$BT/apksigner" verify --print-certs "$APK" \
            | grep 'SHA-1 digest' | head -1 | awk '{print tolower($NF)}' | tr -d ':')"
          KS_SHA1="$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KS_PASS" | grep 'SHA1:' | head -1 \
            | awk '{print tolower($NF)}' | tr -d ':')"
          echo "对账：产物 SHA-1=$APKSIGNER_SHA1 / 钥匙 SHA-1=$KS_SHA1"
          if [ "$APKSIGNER_SHA1" != "$KS_SHA1" ]; then
            echo "::error::产物签名指纹与正式钥匙不一致——错签名的包禁止上传（熔断）"
            exit 1
          fi

      - name: 注册层守卫（产物级 aapt）
        run: |
          python3 ../scripts/check_activity_registration.py \
            --apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lovespace-arm64-v${{ steps.ver.outputs.name }}
          path: app-flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      # GitHub Release 发布（第 4 项发布侧）：标签 app-v<版本>——严禁裸 v*
      # 前缀（会误触 docker.yml 镜像构建与 android.yml 老壳发布两条流水线）。
      # 幂等：同版本重跑 → 更新既有 Release 资产（--clobber），不产生重复。
      # publish_release=false 时整步跳过：验证线出包不许改写线上同名 Release。
      - name: Publish GitHub Release
        if: ${{ github.event.inputs.publish_release != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          VER="${{ steps.ver.outputs.name }}"
          TAG="app-v$VER"
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APK_NAME="app-arm64-v8a-release.apk"
          cp "$APK" "$RUNNER_TEMP/$APK_NAME"
          sha256sum "$RUNNER_TEMP/$APK_NAME" | awk '{print $1}' > "$RUNNER_TEMP/$APK_NAME.sha256"
          BODY="v$VER"$'\n\n'"${NOTES:-本次为正式签名版更新，请参照 2.4.3 交付摘要的卸载重装提醒执行。}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG 已存在 → 更新说明与资产（幂等）"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "恋爱空间 v$VER" --notes "$BODY"
            gh release upload "$TAG" "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/$APK_NAME.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "恋爱空间 v$VER" --notes "$BODY" \
              "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/$APK_NAME.sha256"
          fi
          echo "发布完成：https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
