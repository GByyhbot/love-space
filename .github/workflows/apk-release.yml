# APK Release 构建（仅手动触发 workflow_dispatch）
#
# 用途：本机 Gradle 路径在系统级文件 I/O 上死锁（重启/杀软排除均无效），
# 出包改走 CI。本工作流与 flutter-ci.yml 完全独立——既有 analyze/test 作业不动。
#
# 签名一致性：release 构建用 signingConfigs.debug（默认 ~/.android/debug.keystore）。
# 构建前把仓库 Secret ANDROID_DEBUG_KEYSTORE（base64）解码还原到该路径，
# 保证 CI 产物签名指纹与本机历史出包一致、可覆盖安装真机。
#
# 触发：GitHub 仓库 Actions → "APK Release" → Run workflow → 选 main(adb9e34)。
# 产物：artifact lovespace-arm64-v<版本>，取回后放 output/ 按三行证据交付。
name: APK Release

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 钉版与 flutter-ci.yml / 本机一致
          flutter-version: 3.47.9
          cache: true

      # 还原 debug 签名密钥：release 构建走 signingConfigs.debug，
      # 必须与本机历史出包同一 keystore，否则真机覆盖安装会报签名不一致。
      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_DEBUG_KEYSTORE 未设置，请在仓库 Settings → Secrets → Actions 新建"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android > /dev/null
          # 2.4.3 第 0 点诊断 a：打印还原钥匙的证书指纹（只打指纹，不打内容）
          echo "── 诊断 a：还原的 debug.keystore 证书指纹 ──"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android \
            | grep -E "SHA1:|SHA256:" || true

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')
          VERSION_NAME="${VERSION%%+*}"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "构建版本 $VERSION_NAME"

      - run: flutter pub get

      # 诊断定位：还原钥匙指纹是否会被构建改写 + AGP 实际读哪把钥匙
      - name: Diagnose before build
        run: |
          echo "HOME=$HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-<unset>}"
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-<unset>}"
          echo "GRADLE_USER_HOME=${GRADLE_USER_HOME:-<unset>}"

      - run: flutter build apk --release --split-per-abi

      # 2.4.3 第 0 点诊断 b：打印产物实际签名者证书指纹（与 a 对账）
      - name: Verify signature (print certs)
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          BT="$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort -V | tail -1 | tr -d '\n')"
          echo "── 诊断 b：产物 apksigner 证书指纹（build-tools: $BT）──"
          "$BT/apksigner" verify --print-certs "$APK"

      # 诊断定位：构建后 ~/.android 是否被改写 + 构建期间出现过的所有
      # debug.keystore（AGP 实际读写的那把=指纹等于诊断 b 的那个文件）
      - name: Diagnose after build
        run: |
          echo "── 构建后 \$HOME/.android/debug.keystore 指纹（应仍=诊断 a）──"
          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android \
              | grep -E "SHA1:|SHA256:" || true
            stat -c '%y %s' "$HOME/.android/debug.keystore"
          else
            echo "文件不存在"
          fi
          echo "── 构建期间出现过的 debug.keystore（全盘常见位置）──"
          for d in "$HOME" /tmp /usr/local/lib/android/sdk /home; do
            find "$d" -maxdepth 6 -name "debug.keystore" 2>/dev/null
          done | sort -u | while read -r f; do
            echo "== $f"
            keytool -list -v -keystore "$f" -storepass android 2>/dev/null \
              | grep -E "SHA1:" || echo "  (打不开，可能非默认口令)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: lovespace-arm64-v${{ steps.ver.outputs.name }}
          path: app-flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
