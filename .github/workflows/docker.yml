name: Docker

# 推 main 出 latest + sha，打 tag（v1.2.3）出对应版本号，也可手动触发
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送 ghcr.io 需要

    # secrets 不能直接用在 step 的 if 里，先经 env 中转
    env:
      HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # 关键：构建阶段不登录任何 registry。
      # 一旦登录，BuildKit 会拿该凭据去 auth.docker.io 换基础镜像 library/python 的 token，
      # 凭据作用域不足就报 401 "access token has insufficient scopes"（Docker Hub 的 PAT 默认是只读档）。
      # 基础镜像是公开的，匿名拉取即可；登录只用于最后的 push。
      - name: 构建镜像（未登录，匿名拉基础镜像）
        run: docker build --platform linux/amd64 -t love-space:ci .

      - name: 计算镜像标签
        id: tags
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"   # ghcr 要求全小写
          SHORT="${GITHUB_SHA::7}"
          TAGS="ghcr.io/$OWNER/love-space:sha-$SHORT"
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            TAGS="$TAGS"$'\n'"ghcr.io/$OWNER/love-space:latest"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            TAGS="$TAGS"$'\n'"ghcr.io/$OWNER/love-space:${GITHUB_REF_NAME#v}"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "将推送："
          echo "$TAGS"

      - name: 登录 GitHub 容器仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送镜像到 ghcr.io
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "推送 $tag"
            docker tag love-space:ci "$tag"
            docker push "$tag"
          done <<< "${{ steps.tags.outputs.tags }}"

      # ---- 可选：Docker Hub（secrets 配了才推，且 PAT 必须是 Read & Write）----
      - name: 登录 Docker Hub
        if: env.HUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.HUB_USER }}
          password: ${{ env.HUB_TOKEN }}

      - name: 推送镜像到 Docker Hub
        if: env.HUB_USER != ''
        continue-on-error: true   # Hub 凭据没写权限时不拖垮整条流水线
        run: |
          U="$HUB_USER"
          ok=0; fail=0
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            hub_tag="$U/${tag#ghcr.io/*/}"
            echo "推送 $hub_tag"
            docker tag love-space:ci "$hub_tag"
            if docker push "$hub_tag"; then
              ok=$((ok + 1))
            else
              fail=$((fail + 1))
              echo "::warning::Docker Hub 推送失败，PAT 很可能仍是只读档（Read-only），需改为 Read & Write 后重跑"
            fi
          done <<< "${{ steps.tags.outputs.tags }}"
          echo "Docker Hub：成功 $ok 个，失败 $fail 个"
          exit 0

      - name: 汇总
        if: always()
        run: |
          {
            echo "### 镜像标签"
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
            echo "拉取示例：\`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/love-space:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
