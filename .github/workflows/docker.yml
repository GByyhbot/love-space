name: Docker

# 二标制（定案）：任何构建（main 推送、v* 标签、手动触发）都只打
# latest + 版本号两个标签（ghcr 与 Docker Hub 同清单）；版本号统一取
# 「计算版本号与构建号」步骤的 version 输出。历史 sha-*/edge/小版本
# 标签从此不再更新，保留在 registry 不做清理。也可手动触发。
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送 ghcr.io 需要

    # secrets 不能直接用在 step 的 if 里，先经 env 中转
    env:
      HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 下面要用 git describe 拿版本号

      # 版本号注入到镜像里，/api/status 直接读出来（app/config.py）。
      # 好处是"网页版本号"不再依赖人手改代码：打 v1.2.5 的 tag，界面上就是 1.2.5。
      - name: 计算版本号与构建号
        id: ver
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            # main 上的提交：取最近一个正式 tag 的纯版本号。
            # 以前用 `git describe --tags --always` 会得到 1.2.4-3-gabc1234 这种
            # 带后缀的字符串，界面上难看不说，App 内「检查更新」拿它跟 APK 版本
            # 比对还会串味。构建身份改由 BUILD（sha-日期）表达，版本号保持纯数字。
            # 🔴 --match 'v*' 必须带：APK Release 工作流打的 Release tag 是
            # app-v2.4.x 格式，describe 撞上它后 sed 's/^v//' 不匹配、
            # V%%-* 砍尾巴只剩 "app" —— /api/status version 显示 "app"（2.4.6 实证）。
            V="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//' || true)"
            [ -z "$V" ] && V="0.0.0"
          fi
          # 兜底：任何残留的 -rc1 / -3-gabc 后缀一并砍掉，只留纯版本号
          V="${V%%-*}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_SHA::7}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "版本号：$V"

      # 关键：构建阶段不登录任何 registry。
      # 一旦登录，BuildKit 会拿该凭据去 auth.docker.io 换基础镜像 library/python 的 token，
      # 凭据作用域不足就报 401 "access token has insufficient scopes"（Docker Hub 的 PAT 默认是只读档）。
      # 基础镜像是公开的，匿名拉取即可；登录只用于最后的 push。
      - name: 构建镜像（未登录，匿名拉基础镜像）
        run: |
          docker build --platform linux/amd64 -t love-space:ci \
            --build-arg LOVE_VERSION="${{ steps.ver.outputs.version }}" \
            --build-arg LOVE_APK_VERSION="${{ steps.ver.outputs.version }}" \
            --build-arg LOVE_BUILD="${{ steps.ver.outputs.build }}" .

      # 二标制（定案）：不再区分 branch/tag 两套清单——任何构建都只产出
      # latest + 版本号两个标签；版本号唯一来源是上面 ver 步骤的 version
      # 输出（main 推送 = 最近一个 v 标签的纯版本号；打 v* = 该标签版本号），
      # 此处禁止另算一份。sha-*/edge/小版本标签逻辑已删，历史旧标签保留
      # 在 registry 不清理、只是从此不再前进。
      # 2.8.2 治本：**版本标签只许 tag 构建推送**。
      # 旧实现在 main 推送时用 `git describe` 取到「上一个」版本号并推同名标签，
      # 结果 2.8.1 发版时把 2.8.0 标签覆盖成了 2.8.1 的代码（回滚只剩 digest 可用）。
      # 现在：tag 构建 → latest + X.Y.Z；main 推送 → 仅 edge（非版本标签）。
      - name: 计算镜像标签
        id: tags
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"   # ghcr 要求全小写
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            TAGS="ghcr.io/$OWNER/love-space:latest"$'\n'"ghcr.io/$OWNER/love-space:$V"
            echo "模式：tag 构建（版本 ${V}）→ latest + ${V}"
          else
            # main 推送 / 手动触发：绝不触碰 latest 与任何版本标签
            TAGS="ghcr.io/$OWNER/love-space:edge"
            echo "模式：非 tag 构建（${GITHUB_REF_NAME}）→ 仅 edge，不动 latest/版本标签"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "将推送："
          echo "$TAGS"

      - name: 登录 GitHub 容器仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送镜像到 ghcr.io
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "推送 $tag"
            docker tag love-space:ci "$tag"
            docker push "$tag"
          done <<< "${{ steps.tags.outputs.tags }}"

      # ---- 可选：Docker Hub（secrets 配了才推，且 PAT 必须是 Read & Write）----
      - name: 登录 Docker Hub
        if: env.HUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.HUB_USER }}
          password: ${{ env.HUB_TOKEN }}

      - name: 推送镜像到 Docker Hub
        if: env.HUB_USER != ''
        continue-on-error: true   # Hub 凭据没写权限时不拖垮整条流水线
        run: |
          U="$HUB_USER"
          ok=0; fail=0
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            hub_tag="$U/${tag#ghcr.io/*/}"
            echo "推送 $hub_tag"
            docker tag love-space:ci "$hub_tag"
            if docker push "$hub_tag"; then
              ok=$((ok + 1))
            else
              fail=$((fail + 1))
              echo "::warning::Docker Hub 推送失败，PAT 很可能仍是只读档（Read-only），需改为 Read & Write 后重跑"
            fi
          done <<< "${{ steps.tags.outputs.tags }}"
          echo "Docker Hub：成功 $ok 个，失败 $fail 个"
          exit 0

      - name: 汇总
        if: always()
        run: |
          {
            echo "### 镜像标签"
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
            echo "拉取示例：\`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/love-space:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
