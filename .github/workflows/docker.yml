name: Docker

# 推 main 出 latest + sha，打 tag（v1.2.3）出对应版本号，也可手动触发
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # secrets 没配就直接停下，别让构建白跑一趟
      - name: 检查 Docker Hub 凭据
        id: guard
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::warning::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过镜像构建"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 关键：构建阶段不登录 Docker Hub。
      # 否则 BuildKit 会拿 PAT 去 auth.docker.io 换基础镜像 library/python 的 token，
      # 一旦该凭据作用域受限就报 401 "access token has insufficient scopes"。
      # 基础镜像是公开的，匿名拉取即可；登录只用于最后的 push。
      - name: 构建镜像（未登录，匿名拉基础镜像）
        if: steps.guard.outputs.ready == 'true'
        run: docker build --platform linux/amd64 -t love-space:ci .

      - name: 生成镜像标签
        id: meta
        if: steps.guard.outputs.ready == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/love-space
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: 登录 Docker Hub
        if: steps.guard.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 打标签并推送
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          pushed=0
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "推送 $tag"
            docker tag love-space:ci "$tag"
            docker push "$tag"
            pushed=$((pushed + 1))
          done <<< "${{ steps.meta.outputs.tags }}"
          echo "共推送 $pushed 个标签"
          {
            echo "### 镜像已推送"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
