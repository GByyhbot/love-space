name: Android APK

# 打 v* tag → 构建正式包并发布到 GitHub Release
# 手动触发 / android-app 目录变更 → 只构建并留 artifact，不发布
on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 打 tag 时创建 Release
    steps:
      - uses: actions/checkout@v4

      - name: 校验签名 secrets
        id: guard
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，将回落到 debug 签名（不可用于升级安装）"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      # Capacitor 7 的 capacitor-android 要求 Java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: 安装 npm 依赖（postinstall 会打后台保活补丁）
        working-directory: android-app
        run: npm ci

      - name: 还原签名密钥
        if: steps.guard.outputs.signed == 'true'
        working-directory: android-app
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/keys
          printf '%s' "$KS" | base64 -d > android/keys/release.jks
          chmod 600 android/keys/release.jks
          cat > android/keystore.properties <<EOF
          storeFile=keys/release.jks
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
          echo "签名文件大小: $(stat -c%s android/keys/release.jks) 字节"

      - name: 按 tag 覆盖版本号
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android-app
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CODE="$(date +%Y%m%d)"
          echo "版本 $VERSION，versionCode $CODE"
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle | head -3

      - name: 构建 release APK
        working-directory: android-app/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: 校验产物
        working-directory: android-app
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|^targetSdkVersion" || true
          if [ "${{ steps.guard.outputs.signed }}" = "true" ]; then
            "$BT/apksigner" verify --print-certs "$APK" | head -3
          fi

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: love-space-apk-${{ github.ref_name }}
          path: android-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/android/app/build/outputs/apk/release/app-release.apk
          name: 恋爱空间 ${{ github.ref_name }}
          body: |
            Web 版本与 APK 版本独立，网页功能自动更新，原生壳需安装本包。

            - 安装前请确认已允许「安装未知来源应用」
            - **若此前装的是 debug 签名版本，必须先卸载再安装**（签名不同无法覆盖）
            - 首次启动需重新登录并重新授权通知权限
          fail_on_unmatched_files: true
