services:
  love:
    # 只用 CI 构建好的镜像，NAS 上不编译：部署目录里只有 compose + .env + data。
    # 镜像 tag 由 .env 里的 LOVE_IMAGE 指定，部署脚本每次按 commit sha 写入；
    # 没设时退回 latest —— 注意 latest 只在打 v* 正式 tag 时才前进，不是"最新提交"。
    # 想在 NAS 上编译（GitHub/CI 不可用时的应急），见 .workbuddy/deploy_sync.py --local。
    image: ${LOVE_IMAGE:-2126263229/love-space:latest}
    container_name: love-space
    # 非 root 运行。镜像里已写 USER，这里再指定一次是为了让"补丁镜像"（叠层打出来的
    # 那种不带 USER 指令）也同样降权 —— compose 的 user 优先级高于镜像的 USER。
    # 1000:1001 对齐 NAS 上的普通用户 Yyh154019:Users，数据卷里的文件主人能直接改；
    # 别写成 1000:1000，那是 Administrators 组。
    user: "${LOVE_UID:-1000}:${LOVE_GID:-1001}"
    restart: unless-stopped
    # 日志不设上限时 json-file 会一直长，跑几个月能把 /var/lib/docker 撑爆
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 内存上限：视频抽帧/转码时 ffmpeg 会短暂吃内存，留够余量但仍要兜底，
    # 避免单个容器把整台 NAS 拖垮（OOM 只杀这个容器，宿主其它服务不受影响）
    mem_limit: ${LOVE_MEM_LIMIT:-2g}
    ports:
      # 双栈监听（IPv4 + IPv6 全接口）。写死不用 .env：
      # yangyuhui86.top 是纯 AAAA 域名，App 靠 [240e:...]:1314 做 IPv6 直连加速，
      # 原先 ${LOVE_BIND_ADDRESS:-127.0.0.1} 只绑 IPv4 内网 —— IPv6 连接直接被拒，
      # 表现为「本来最快的最后一条线路无法连通」。Docker 简写 "1314:1314"
      # 会同时监听 0.0.0.0:1314 和 [::]:1314；IPv4 公网仍无映射（路由器只转 4019），
      # 所以实际新增暴露面只有公网 IPv6 —— 这正是直连线路需要的。
      - "1314:1314"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    volumes:
      - ./data:/data
      # 情侣摆拍参考图库（ai-pose-gallery-zh 静态站）：同源托管，只读挂载，不进镜像
      # 卷路径已随 2026-11-01 迁移入 LARJ，勿改回 /vol1/1000/pose-gallery
      - /vol1/1000/LARJ/pose-gallery:/srv/pose-gallery:ro
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      # 根文件系统只读、HOME 不能落在不存在且不可写的地方，否则缓存类库会炸
      HOME: /tmp
      # 公网访问地址（用于来源校验与通知跳转）
      PUBLIC_URL: ${PUBLIC_URL:-https://love-space.iepose.cn}
      # 会话 Cookie 是否带 Secure：默认 true（https 才发）。内网明文 http 访问时
      # 后端会按请求协议自动降级，不需要为了局域网访问把它设成 false。
      SECURE_COOKIES: "${SECURE_COOKIES:-true}"
      # 首次远程初始化时，在 .env 中设置一次性随机口令；初始化后删除
      SETUP_TOKEN: "${SETUP_TOKEN:-}"
      # 单文件上传上限（MB）
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-250}"
      # 低存储告警阈值（MB）
      LOW_STORAGE_MB: "${LOW_STORAGE_MB:-1024}"
      # Built-in browser/native push server; must be HTTPS.
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.350921.xyz}
      # 内置 ntfy 系统推送总开关：0=停用（默认，通知走企业微信/Web Push），1=恢复手机弹窗
      NTFY_ENABLED: ${NTFY_ENABLED:-0}
      # Encrypt newly generated full backups when configured.
      BACKUP_PASSWORD: ${BACKUP_PASSWORD:-}
      BACKUP_EXTRA_DIR: ${BACKUP_EXTRA_DIR:-}
      RUN_WORKER: ${RUN_WORKER:-true}
      NOTIFY_ALLOWED_PRIVATE_HOSTS: ${NOTIFY_ALLOWED_PRIVATE_HOSTS:-}
