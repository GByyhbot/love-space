services:
  love:
    # 双模式：本地构建（docker compose up -d --build）或用 Docker Hub 预构建镜像
    # （docker compose pull && docker compose up -d）。镜像名可用 LOVE_IMAGE 覆盖。
    image: ${LOVE_IMAGE:-ghcr.io/gbyyhbot/love-space:latest}
    build:
      context: .
      args:
        # 国内网络加速（海外部署可删除这两行）
        APT_MIRROR: mirrors.tuna.tsinghua.edu.cn
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        # 版本号注入：本地构建默认 dev/local；CI 会用 git tag 与 commit 覆盖
        LOVE_VERSION: ${LOVE_VERSION:-dev}
        LOVE_BUILD: ${LOVE_BUILD:-local}
    container_name: love-space
    restart: unless-stopped
    # 日志不设上限时 json-file 会一直长，跑几个月能把 /var/lib/docker 撑爆
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 内存上限：视频抽帧/转码时 ffmpeg 会短暂吃内存，留够余量但仍要兜底，
    # 避免单个容器把整台 NAS 拖垮（OOM 只杀这个容器，宿主其它服务不受影响）
    mem_limit: ${LOVE_MEM_LIMIT:-2g}
    ports:
      - "${LOVE_BIND_ADDRESS:-127.0.0.1}:1314:1314"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      # 公网访问地址（用于来源校验与通知跳转）
      PUBLIC_URL: ${PUBLIC_URL:-https://love-space.iepose.cn}
      # 登录会话 Cookie 仅通过 HTTPS 发送；HTTP 访问无法维持登录状态
      SECURE_COOKIES: "${SECURE_COOKIES:-true}"
      # 首次远程初始化时，在 .env 中设置一次性随机口令；初始化后删除
      SETUP_TOKEN: "${SETUP_TOKEN:-}"
      # 单文件上传上限（MB）
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-250}"
      # 低存储告警阈值（MB）
      LOW_STORAGE_MB: "${LOW_STORAGE_MB:-1024}"
      # Built-in browser/native push server; must be HTTPS.
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.350921.xyz}
      # 内置 ntfy 系统推送总开关：0=停用（默认，通知走企业微信/Web Push），1=恢复手机弹窗
      NTFY_ENABLED: ${NTFY_ENABLED:-0}
      # Encrypt newly generated full backups when configured.
      BACKUP_PASSWORD: ${BACKUP_PASSWORD:-}
      BACKUP_EXTRA_DIR: ${BACKUP_EXTRA_DIR:-}
      RUN_WORKER: ${RUN_WORKER:-true}
      NOTIFY_ALLOWED_PRIVATE_HOSTS: ${NOTIFY_ALLOWED_PRIVATE_HOSTS:-}
